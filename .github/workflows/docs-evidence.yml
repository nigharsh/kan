name: Documentation evidence request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to inspect
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-request-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the exact PR and changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          number = os.environ['PR_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]{0,7}', number):
              raise SystemExit('Invalid PR number')
          if os.environ['REPOSITORY'] != 'nigharsh/kan':
              raise SystemExit('This integration is scoped to nigharsh/kan')
          base = 'https://api.github.com/repos/nigharsh/kan/pulls/' + number
          def get(url):
              req = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)
          pr = get(base)
          files = []
          for page in range(1,31):
              batch = get(base+'/files?per_page=100&page='+str(page))
              files.extend(batch)
              if len(batch) < 100:break
          latest = get(base)
          if latest['head']['sha'] != pr['head']['sha'] or latest['base']['sha'] != pr['base']['sha']:
              raise SystemExit('PR changed while reading files; prepare a fresh request')
          Path('pr.json').write_text(json.dumps(pr))
          Path('changed-files.json').write_text(json.dumps(files))
          PY
      - name: Check request mapping
        run: python3 -m unittest discover -s .github -p 'test_contextqa_docs_request.py'
      - name: Prepare the documentation capture request
        run: python3 .github/contextqa_docs_request.py --pr pr.json --files changed-files.json --out docs-refresh-request.json
      - name: Explain the result
        run: |
          python3 - <<'PY'
          import json, os
          d=json.load(open('docs-refresh-request.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Documentation refresh request\n\n')
              f.write('PR: '+str(d['pull_request'])+'; commit: `'+d['head_sha']+'`\n\n')
              f.write('Affected workflows: '+(', '.join(d['workflows']) or 'none')+'\n\n')
              f.write('This check prepares a capture request. It does not run ContextQA, validate the deployment, or publish documentation. The requested Max mode, authenticated capture and media review must be verified before completion.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-refresh-request-${{ github.event.pull_request.number || inputs.pull_request }}
          path: docs-refresh-request.json
          retention-days: 7
